# Free Supabase projects pause after about a week with no database activity
# (for example over the school holidays). This makes one tiny call to Lesson
# Register's database twice a week so it stays awake. It reads nothing and
# changes nothing.
name: Lesson Register keep database awake

on:
  schedule:
    - cron: '17 21 * * 0,3' # Sunday and Wednesday, about 8am Sydney time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Database not configured yet"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
