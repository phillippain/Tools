# Publishes this repository to GitHub Pages on every push to main.
# Every tool folder is published as it is (for example interview-timekeeper/),
# except lesson-register/, which is built first and published as its built site.
# _home/ (what builds the password-protected home page) is not published.
#
# Turn on once: Settings → Pages → Build and deployment → Source: GitHub Actions.
# For Lesson Register's database, set two repository variables (Settings →
# Secrets and variables → Actions → Variables): SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY. Without them Lesson Register builds in demo mode.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lesson-register/package-lock.json
      - name: Build Lesson Register
        working-directory: lesson-register
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble the site
        run: |
          mkdir _site
          for f in *; do
            case "$f" in
              _site | lesson-register | _home) ;;
              *) cp -R "$f" _site/ ;;
            esac
          done
          cp -R lesson-register/dist _site/lesson-register
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
